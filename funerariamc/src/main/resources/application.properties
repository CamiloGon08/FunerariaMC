spring.application.name=funerariamc

# --- Credenciales: se leen de un archivo local que NO se sube a GitHub ---
spring.config.import=optional:file:./credentials.properties

# --- Aplicación de escritorio (JavaFX): no levanta servidor web ---
spring.main.web-application-type=none

# --- Conexión a PostgreSQL en Supabase ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true