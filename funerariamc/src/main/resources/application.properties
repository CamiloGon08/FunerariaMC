spring.application.name=funerariamc

# --- Credenciales: se leen de un archivo local que NO se sube a GitHub ---
spring.config.import=optional:file:./credentials.properties

# --- Aplicación de escritorio (JavaFX): no levanta servidor web ---
spring.main.web-application-type=none

# --- Conexión a PostgreSQL en Supabase ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Pool de conexiones: Supabase está lejos (us-west-2), cada conexión nueva cuesta casi 1 s ---
# Se dejan 2 conexiones abiertas y se mantienen vivas para que cambiar de módulo no espere el reconectar.
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.keepalive-time=120000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Imprimir cada consulta en la consola hace más lenta la app; activarlo solo para depurar.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false


# --- Correo para "Olvidó su contraseña" (valores reales en credentials.properties) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Telegram (si queda vacío, el código sale por correo) ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# --- Recuperación de contraseña ---
app.password-reset.expiration-minutes=10
app.password-reset.max-attempts=5