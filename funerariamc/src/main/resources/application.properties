spring.application.name=funerariamc

# --- Credenciales: se leen de un archivo local que NO se sube a GitHub ---
spring.config.import=optional:file:./credentials.properties

# --- Aplicación de escritorio (JavaFX): no levanta servidor web ---
spring.main.web-application-type=none

# --- Conexión a PostgreSQL en Supabase ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# --- Correo para "Olvidó su contraseña" (valores reales en credentials.properties) ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Telegram (si queda vacío, el código sale por correo) ---
telegram.bot.token=${TELEGRAM_BOT_TOKEN:}

# --- Recuperación de contraseña ---
app.password-reset.expiration-minutes=10
app.password-reset.max-attempts=5